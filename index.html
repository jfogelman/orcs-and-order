<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orcs &amp; Order</title>
    <meta
      name="description"
      content="A small, extremely tongue-in-cheek 4X in which orcs slowly discover that two orcs can stand in the same place."
    />
  </head>
  <body>
    <div id="game">
      <canvas id="map"></canvas>

      <header id="topbar">
        <div class="brand">Orcs &amp; Order</div>
        <div class="stat" id="stat-civ">—</div>
        <div class="stat" id="stat-turn">Turn 1</div>
        <div class="stat" id="stat-gold">0g</div>
        <div class="stat wide" id="stat-research">Researching nothing in particular</div>
        <div class="spacer"></div>
        <button id="btn-mute" title="Mute (M)">Sound: on</button>
        <button id="btn-tech" title="Tech tree (T)">Advances</button>
        <button id="btn-report" title="Everything you own, on one screen (I)">Report</button>
        <button id="btn-advisors" title="Six opinions about it (A)">Advisors</button>
        <button id="btn-pedia" title="Orcpedia (P)">Orcpedia</button>
        <button id="btn-save" title="Save and load (Ctrl+S)">Saves</button>
        <button id="btn-new" title="Start a new game">New Game</button>
        <button id="btn-endturn" class="primary" title="End turn (Enter)">End Turn</button>
      </header>

      <aside id="sidebar">
        <div id="selection" class="panel">
          <div class="panel-title">Selection</div>
          <div class="panel-body muted">Nothing selected.</div>
        </div>
      </aside>

      <div id="minimap-panel">
        <canvas id="minimap"></canvas>
      </div>

      <div id="logbox"></div>
    </div>

    <div id="modal-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
