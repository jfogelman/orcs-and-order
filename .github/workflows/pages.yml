# Build the game and publish it to GitHub Pages.
#
# The site is plain static files with no runtime dependencies, and vite is
# configured with `base: './'`, so it works from a project subpath without
# knowing the repository name.
#
# The art in public/ is committed rather than regenerated here on purpose --
# see .gitignore for why.
name: Pages

on:
  push:
    # main only. A working branch was listed here while main was still empty,
    # which is no longer true -- and since Pages was enabled, the github-pages
    # environment only accepts deployments from the default branch anyway, so
    # any other branch here would build, fail at the deploy step, and tell
    # somebody their push was broken when it was not.
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, and mint the token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued rather than cancelled, so a push that lands
# mid-deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Tests before the build, because until now nothing here ran them: the
      # deploy typechecked and bundled, so a green deploy said nothing at all
      # about whether the game still worked. A broken test sat on main for
      # several merges without anybody being told.
      - run: npm test
      # `npm run build` typechecks before it bundles, so a type error stops
      # the deploy rather than shipping.
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
